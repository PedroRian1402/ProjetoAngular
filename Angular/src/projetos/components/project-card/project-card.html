<div>
    <h3>{{ project.name }}</h3>
    <p>{{ project.description }}</p>
    <div>
        <span>
            Tarefas: {{ completedTasks }}/{{ totalTasks }}
        </span>
        <span>
            {{ progressPercentage }}%
        </span>
    </div>
</div>

<div>
    @for(t of project.task; track t.id){
        <div>
            <input type="checkbox" [checked]="t.status === 'concluída'" (change)="toggleTaskStatus(t)">
            <span>{{ t.title }}</span>
        </div>
    } @empty {
        Sem tarefas associadas ao Projeto.
    }
</div>

<div>
    <div>
      <h5>+ Adicionar Nova Tarefa a este Projeto</h5>
      
      <div>
        <label [attr.for]="'new-title-' + project.id">Título:</label>
        <input #newTitle [id]="'new-title-' + project.id" type="text" placeholder="Título da tarefa" />
      </div>

      <div>
        <label [attr.for]="'new-desc-' + project.id">Descrição:</label>
        <textarea #newDesc [id]="'new-desc-' + project.id" placeholder="Descrição da tarefa"></textarea>
      </div>

      <div>
        <label [attr.for]="'new-date-' + project.id">Data Limite:</label>
        <input #newDate [id]="'new-date-' + project.id" type="date" />
      </div>
    
    <button type="button" (click)="addNewTaskToProject(newTitle, newDesc, newDate)">Adicionar tarefa</button>
</div>
